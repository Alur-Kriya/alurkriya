<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 54" width="220" height="54" fill="none">
  <!-- Ubuntu Circle of Friends mark -->
  <g transform="translate(10, 11)">
    <!-- Outer circle -->
    <circle cx="16" cy="16" r="16" fill="#E95420"/>
    <!-- Three friends dots -->
    <circle cx="7" cy="16" r="2.2" fill="#FFFFFF"/>
    <circle cx="21" cy="7.5" r="2.2" fill="#FFFFFF"/>
    <circle cx="21" cy="24.5" r="2.2" fill="#FFFFFF"/>
    <!-- Circle segments -->
    <path d="M12.5 12.5a5 5 0 0 1 7-1.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M19.5 21a5 5 0 0 1-7-1.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M11 16a5 5 0 0 1 0-0.1" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <!-- Text: Canonical / Ubuntu -->
  <text x="52" y="27" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#2C001E" class="text-brand">Canonical</text>
  <text x="52" y="43" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#E95420">Ubuntu Partner</text>
  <style>
    @media (prefers-color-scheme: dark) {
      .text-brand { fill: #F7F7F7; }
    }
    :root.dark .text-brand { fill: #F7F7F7; }
  </style>
</svg>

