<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 54" width="230" height="54" fill="none">
  <!-- Microsoft 4-square logo mark -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="15" height="15" fill="#F25022"/>
    <rect x="18" y="0" width="15" height="15" fill="#7FBA00"/>
    <rect x="0" y="18" width="15" height="15" fill="#00A4EF"/>
    <rect x="18" y="18" width="15" height="15" fill="#FFB900"/>
  </g>
  <!-- Text: Microsoft Azure -->
  <text x="54" y="27" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#5E5E5E" class="text-brand">Microsoft</text>
  <text x="54" y="44" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#0078D4">Azure</text>
  <style>
    @media (prefers-color-scheme: dark) {
      .text-brand { fill: #F3F3F3; }
    }
    :root.dark .text-brand { fill: #F3F3F3; }
  </style>
</svg>

